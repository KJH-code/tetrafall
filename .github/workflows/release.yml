# 고도판 배포 묶음 → GitHub Release
# 실행 방법 셋: ① 태그 v* 를 push ② Actions 탭 'Run workflow' (main 에 이 파일이 있을 때) ③ 아무 브랜치에
# 커밋 메시지에 [release <태그>] 를 넣어 push (예: [release v0.1.0-godot-preview]) — 태그를 직접 못 올릴 때. 태그는 이 커밋에 만들어짐.
# 묶음: godot/server/tools/package.mjs (서버 + 고도 웹 + 고도 PC 클라 + cloudflared, win·linux zip)
# 웹 템플릿 (W5 2026-11-02 재혁: 직접 빌드한 웹 템플릿을 배포에도 — wasm br 6.9 → 5.4MB): web-template job 이 godot/client/tools/build-web-template.sh 로
# 빌드해 artifact 로 package 에 넘김. 캐시 키 = 고도·emsdk 버전 + 스크립트 해시 → 두 번째부터는 빌드 건너뜀 (첫 빌드 40~60분).
# 캐시는 그 브랜치와 기본 브랜치 (main) 것만 보임 — 새 브랜치의 [release ...] 첫 실행은 main 에 캐시가 없으면 다시 빌드.
# 템플릿 빌드가 실패하면 (continue-on-error) package 는 공식 템플릿으로 묶음 — 릴리스가 템플릿 때문에 막히지 않게
# 켜기/끄기 (W36): 기본은 끔 (공식 템플릿 — 첫 빌드가 150분 job 이라 릴리스가 너무 길어짐). 켜려면
#   ① 저장소 변수 WEB_TEMPLATE_BUILD = true (Settings > Secrets and variables > Actions > Variables, 이후 모든 릴리스) 또는
#   ② 'Run workflow' 의 web_template 체크 (그 실행만)
# 한 번 빌드해 캐시에 들어가면 (키 = 고도·emsdk 버전 + 스크립트 해시) 다음부터는 캐시만 받아 몇 분 → 그때 변수를 켜 두면 됨. 끄면 web-template job 은 건너뜀 (skipped)
name: release

on:
  push:
    tags: ['v*']
    branches: ['**']
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스 태그 (예: v0.1.0-godot)'
        required: true
      prerelease:
        description: '미리보기(prerelease)로'
        type: boolean
        default: true
      web_template:
        description: '작은 웹 템플릿 직접 빌드 (캐시 없으면 40~60분 더 — 기본 끔 = 공식 템플릿)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  EM_VERSION: 4.0.11 # 고도 4.7.2 CI web_builds.yml 의 EM_VERSION
  WEB_TEMPLATE_ZIP: godot.web.template_release.wasm32.nothreads.zip

jobs:
  web-template:
    # 끔이 기본: 변수 WEB_TEMPLATE_BUILD == 'true' 이거나 수동 실행에서 web_template 을 켰을 때만
    if: ${{ (vars.WEB_TEMPLATE_BUILD == 'true' || inputs.web_template == true) && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: 캐시에서 템플릿
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/web-template
          key: web-template-godot${{ env.GODOT_VERSION }}-em${{ env.EM_VERSION }}-${{ hashFiles('godot/client/tools/build-web-template.sh') }}

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: 템플릿 빌드 (캐시 없을 때만, 40~60분)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          pip install scons
          bash godot/client/tools/build-web-template.sh "$RUNNER_TEMP/wt"
          mkdir -p ~/web-template
          cp "$RUNNER_TEMP/wt/godot/bin/$WEB_TEMPLATE_ZIP" ~/web-template/

      - name: 템플릿 확인
        run: |
          set -e
          f=~/web-template/$WEB_TEMPLATE_ZIP
          unzip -l "$f" | grep -q ' godot\.wasm$'
          unzip -l "$f" | grep -q ' godot\.js$'
          ls -la "$f"

      - name: 캐시에 템플릿
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/web-template
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: web-template
          path: ~/web-template/${{ env.WEB_TEMPLATE_ZIP }}
          retention-days: 1
          compression-level: 0

  package:
    needs: web-template
    # 템플릿 job 이 실패해도 돎 (!cancelled) — 그땐 공식 템플릿
    if: ${{ !cancelled() && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: 태그 이름
        id: tag
        env:
          MSG: ${{ github.event.head_commit.message }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then t="$INPUT_TAG"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then t="${GITHUB_REF#refs/tags/}"
          else t=$(printf '%s' "$MSG" | grep -o '\[release [^]]*\]' | head -1 | sed 's/^\[release //; s/\]$//'); fi
          [ -n "$t" ] || { echo "태그 이름 없음"; exit 1; }
          echo "name=$t" >> "$GITHUB_OUTPUT"
          case "$t" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT";; *) echo "pre=false" >> "$GITHUB_OUTPUT";; esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: npm install
        run: npm ci || npm install

      - name: 고도 + 내보내기 템플릿
        run: |
          set -e
          V=$GODOT_VERSION
          base=https://github.com/godotengine/godot/releases/download/$V-stable
          mkdir -p ~/godot && cd ~/godot
          # 내려받기가 도중에 끊기면 (v0.1.13 첫 시도: 템플릿 tpz 가 잘려서 unzip 실패) 다시: 재시도 + 못 열면 지우고 다시
          dl() { # dl <파일> — 받고 zip 으로 열리는지 확인, 최대 5번
            for i in 1 2 3 4 5; do
              curl -fSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 -o "$1" "$base/$1" && unzip -tq "$1" >/dev/null && return 0
              echo "내려받기 실패 ($i/5): $1"; rm -f "$1"; sleep $((i * 5))
            done
            echo "내려받기 포기: $1"; return 1
          }
          dl Godot_v$V-stable_linux.x86_64.zip
          unzip -q Godot_v$V-stable_linux.x86_64.zip
          dl Godot_v$V-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/$V.stable
          mkdir -p $T
          unzip -q -j Godot_v$V-stable_export_templates.tpz \
            templates/web_nothreads_release.zip templates/windows_release_x86_64.exe \
            templates/linux_release.x86_64 templates/version.txt -d $T
          rm Godot_v$V-stable_export_templates.tpz
          echo "GODOT=$HOME/godot/Godot_v$V-stable_linux.x86_64" >> $GITHUB_ENV

      - name: 직접 빌드한 웹 템플릿 받기
        if: needs.web-template.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: web-template
          path: ${{ runner.temp }}/web-template

      - name: 웹 템플릿 고르기
        run: |
          f="$RUNNER_TEMP/web-template/$WEB_TEMPLATE_ZIP"
          if [ -f "$f" ] && unzip -l "$f" | grep -q ' godot\.wasm$'; then
            echo "GODOT_WEB_TEMPLATE=$f" >> "$GITHUB_ENV"
            echo "웹 템플릿: 직접 빌드 ($(du -h "$f" | cut -f1))" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "웹 템플릿: 공식 (직접 빌드 job 결과 ${{ needs.web-template.result }} — skipped 는 끔이 기본, 켜기: 변수 WEB_TEMPLATE_BUILD=true)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # cloudflared (W36): 태그별로 캐시. GitHub 가 504 일 때도 릴리스가 나가게 — 최신 태그 조회가 실패하면 예전 캐시 (restore-keys), 그것도 없으면
      # package.mjs 가 cloudflared 없이 묶고 경고 + README.txt/릴리스 노트에 '직접 설치' 안내 (--require-cloudflared 를 붙이면 반대로 실패시킴)
      - name: cloudflared 최신 태그
        id: cf
        continue-on-error: true
        run: |
          t=$(curl -sI --max-time 20 --retry 3 --retry-all-errors https://github.com/cloudflare/cloudflared/releases/latest | tr -d '\r' | awk -F/ 'tolower($1) ~ /^location:/ {print $NF}')
          echo "tag=${t:-unknown}" >> "$GITHUB_OUTPUT"
          echo "cloudflared 최신 태그: ${t:-모름 (캐시 있으면 그것을 씀)}"

      - name: cloudflared 캐시 (태그가 같으면 받기 생략, 새 태그면 받은 뒤 저장)
        if: steps.cf.outputs.tag != 'unknown'
        uses: actions/cache@v4
        with:
          path: ~/cloudflared-cache
          key: cloudflared-${{ steps.cf.outputs.tag }}

      - name: cloudflared 캐시 (태그를 못 알아냈을 때 — 가장 최근 것만 꺼냄, 저장 안 함)
        if: steps.cf.outputs.tag == 'unknown'
        uses: actions/cache/restore@v4
        with:
          path: ~/cloudflared-cache
          key: cloudflared-unknown
          restore-keys: cloudflared-

      - name: 묶기
        timeout-minutes: 40
        env:
          # 태그를 알면 latest 대신 그 태그를 받아서 캐시 키와 받은 파일이 어긋나지 않게
          CLOUDFLARED_TAG: ${{ steps.cf.outputs.tag != 'unknown' && steps.cf.outputs.tag || '' }}
        # GODOT_WEB_TEMPLATE 가 있으면 package.mjs 가 웹 내보내기에 그 템플릿을 씀 (없으면 공식)
        run: node godot/server/tools/package.mjs --godot "$GODOT" --targets win,linux --cloudflared --cloudflared-cache "$HOME/cloudflared-cache" --cloudflared-budget 600

      - name: 릴리스 노트 덧붙임
        id: notes
        run: |
          # package.mjs 가 cloudflared 를 못 넣은 플랫폼이 있을 때만 dist/release-notes.md 에 글을 씀
          if [ -s dist/release-notes.md ]; then echo "body=dist/release-notes.md" >> "$GITHUB_OUTPUT"; fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || steps.tag.outputs.pre == 'true' }}
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.body }}
          files: |
            dist/tetrafall-win-x64.zip
            dist/tetrafall-linux-x64.zip
