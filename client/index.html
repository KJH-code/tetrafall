<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Tetrafall</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #status { position: absolute; top: 10px; left: 10px; font-size: 14px; line-height: 1.5; background: rgba(0,0,0,.45); padding: 8px 10px; border-radius: 6px; white-space: pre; }
    #center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; font-size: 20px; background: rgba(0,0,0,.55); padding: 14px 20px; border-radius: 8px; pointer-events: auto; white-space: pre; }
    #center button { font-size: 18px; padding: 8px 18px; margin-top: 10px; cursor: pointer; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border: 2px solid rgba(255,255,255,.8); border-radius: 50%; }
    #help { position: absolute; bottom: 10px; left: 10px; font-size: 12px; color: #aaa; white-space: pre; background: rgba(0,0,0,.35); padding: 6px 8px; border-radius: 6px; }
    #flash { position: absolute; inset: 0; background: rgba(255,0,0,.35); opacity: 0; transition: opacity .3s; }
    .hidden { display: none !important; }
  </style>
  <script type="importmap">
    { "imports": { "three": "/vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud">
    <div id="flash"></div>
    <div id="status">연결 중...</div>
    <div id="crosshair"></div>
    <div id="center"><span id="center-text">연결 중...</span><br /><button id="start-btn" class="hidden">시작</button></div>
    <div id="help">WASD 이동 · Space 점프 · Shift 대시 · 좌클릭 밀치기 · 우클릭 투사체(넉백 아이템 필요)
조종 중: 방향키 블록 이동 · Q/E 회전 · Enter 하드드롭 (8초 안에)</div>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
