html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background: #05040b; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh;
	background: radial-gradient(ellipse at 50% 60%, color-mix(in srgb, var(--g) 18%, var(--bg)) 0%, var(--bg) 70%); visibility: hidden; transition: opacity .35s; }
#status.out { opacity: 0; }
#tf-logo { font: 13vmin/1 'TFLoad', 'Arial Black', sans-serif; letter-spacing: .04em; color: #fff;
	text-shadow: 0 0 .06em #fff, 0 0 .2em var(--g), 0 0 .5em var(--g2); animation: tf-breathe 2.4s ease-in-out infinite; }
@keyframes tf-breathe { 50% { text-shadow: 0 0 .06em #fff, 0 0 .28em var(--g), 0 0 .8em var(--g2); } }
#tf-bar { width: min(56vw, 640px); height: 10px; transform: skewX(-20deg); border: 2px solid var(--g); box-shadow: 0 0 14px var(--g2); background: rgba(255,255,255,.05); overflow: hidden; }
#tf-fill { height: 100%; width: 0; background: linear-gradient(90deg, #fff, var(--g)); box-shadow: 0 0 12px var(--g); transition: width .2s; }
#tf-bar.busy #tf-fill { width: 30% !important; animation: tf-run 1.1s linear infinite; }
@keyframes tf-run { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
#tf-text { font: 2.2vmin/1 'TFLoad', sans-serif; letter-spacing: .1em; color: var(--g); opacity: .85; min-height: 1em; }
#status-notice { display: none; max-width: 70vw; padding: 1em; border: 2px solid var(--g); font: 16px sans-serif; text-align: center; }
@media (prefers-reduced-motion: reduce) { #tf-logo, #tf-bar.busy #tf-fill { animation: none; } }
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="tf-logo">TETRAFALL</div>
			<div id="tf-bar"><div id="tf-fill"></div></div>
			<div id="tf-text"></div>
			<div id="status-notice"></div>
		</div>
		<script>
// 테마 빛 (config TITLE_THEMES: [edge, glow, bg])
(function () {
	const T = [['#ff7be6', '#ff4fd8', '#07040d'], ['#ff7a2a', '#ff5a14', '#070202'], ['#ffd070', '#ffb030', '#04071a'], ['#60ffe0', '#30ffc8', '#030a0c'], ['#9cc6ff', '#6fa8ff', '#050820'], ['#ffb050', '#ff9a30', '#080504'], ['#a8f050', '#7ee030', '#030810']];
	const t = T[Math.floor(Math.random() * T.length)];
	const s = document.documentElement.style;
	s.setProperty('--g', t[0]); s.setProperty('--g2', t[1]); s.setProperty('--bg', t[2]);
	document.body.style.background = t[2];
}());
		</script>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusBar = document.getElementById('tf-bar');
	const statusFill = document.getElementById('tf-fill');
	const statusText = document.getElementById('tf-text');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') { // 짧게 흐려지며 사라짐 (그동안 첫 화면이 뒤에서 그려짐)
			statusOverlay.classList.add('out');
			setTimeout(() => statusOverlay.remove(), 350);
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusBar.style.display = mode === 'progress' ? 'block' : 'none';
		statusText.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				// 받는 동안: 막대 + %, 다 받으면 '준비 중' (wasm 컴파일·엔진 켜기, 막대가 흐름)
				if (current > 0 && total > 0 && current < total) {
					statusBar.classList.remove('busy');
					statusFill.style.width = (100 * current / total).toFixed(1) + '%';
					statusText.textContent = Math.floor(100 * current / total) + '%'; // 고도가 주는 크기는 압축 풀린 값 (받는 양과 다름) → 비율만
				} else {
					statusBar.classList.add('busy');
					statusText.textContent = current > 0 ? 'LOADING' : '';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
