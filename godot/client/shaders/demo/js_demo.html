<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/jsm/" } }</script></head><body>
<script type="module">
import * as THREE from 'three';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';
import { CONFIG as C } from '/shared/config.js';
import { toon } from '/toon.js';

import { blockStyle } from '/shared/block-style.js';

import { pieceSpec } from '/shared/piece-look.js';
const Q = new URLSearchParams(location.search);
const TERR = Q.has('terrain'); // ?terrain: 테마 지형 블록 (terrain_grids.json, g3_demo --terrain 과 같음)
const CX = TERR ? 6 : 4;

THREE.Object3D.DEFAULT_UP.set(0, 0, 1);

R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(R.domElement);

const scene = new THREE.Scene();
// 테마 (world.js apply 와 같은 값): ?theme=crystal 등, 없으면 예전 노을 (render.js 생성자)
const L = C.WORLD_THEMES[Q.get('theme')] || null;

scene.background = new THREE.Color(SKY.horizon);
scene.fog = L ? new THREE.Fog(L.fog[0], L.fog[1], L.fog[2]) : new THREE.Fog(C.SKY_HORIZON, C.FOG_NEAR, C.FOG_FAR);

sun.position.set(CX, CX, 0).addScaledVector(new THREE.Vector3(...SUN_DIR).normalize(), 30);
// 하늘 구 (render.js skyDome 그대로 복사)
const domeMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    top: { value: new THREE.Color(SKY.top) }, mid: { value: new THREE.Color(SKY.mid) }, horizon: { value: new THREE.Color(SKY.horizon) },
    sunDir: { value: new THREE.Vector3(...SUN_DIR).normalize() },
    below: { value: L ? new THREE.Color(SKY.below) : new THREE.Color(C.SKY_HORIZON).multiplyScalar(0.55) },
    glow: { value: L && SKY.glow !== undefined ? new THREE.Vector3().setFromColor(new THREE.Color(SKY.glow)) : new THREE.Vector3(1.0, 0.65, 0.35) },
    disc: { value: L && SKY.disc !== undefined ? new THREE.Vector3().setFromColor(new THREE.Color(SKY.disc)) : new THREE.Vector3(1.0, 0.93, 0.75) },
    discSize: { value: (L && SKY.discSize) ?? 0.0005 }, stars: { value: (L && SKY.stars) || 0 },
  },
  vertexShader: `varying vec3 vDir;
    void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 mid; uniform vec3 horizon; uniform vec3 sunDir; uniform vec3 below; uniform vec3 glow; uniform vec3 disc; uniform float discSize; uniform float stars; varying vec3 vDir;
    void main() {
      float h = clamp(vDir.z, -1.0, 1.0);
      vec3 c = h < 0.25 ? mix(horizon, mid, smoothstep(0.0, 0.25, h)) : mix(mid, top, smoothstep(0.25, 0.85, h));
      if (h < 0.0) c = mix(horizon, below, smoothstep(0.0, -0.4, h));
      float s = max(dot(normalize(vDir), sunDir), 0.0);
      if (stars > 0.0) {
        vec3 g = floor(normalize(vDir) * 220.0);
        float hs = fract(sin(dot(g, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
        c += vec3(step(0.9972, hs) * stars * smoothstep(0.04, 0.35, h) * (0.5 + 0.5 * fract(hs * 91.0)));
      }
      c += glow * pow(s, 8.0) * 0.45;
      c = mix(c, disc, smoothstep(1.0 - discSize - 0.001, 1.0 - discSize, s));
      gl_FragColor = vec4(c, 1.0);
    }`,
});
domeMat.userData.outlineParameters = { visible: false };
const dome = new THREE.Mesh(new THREE.SphereGeometry(150, 32, 16), domeMat);
dome.position.set(CX, CX, 0); dome.renderOrder = -1;
scene.add(dome);
sun.target.position.set(CX, CX, 0);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 5, far: 60 });

scene.add(sun, sun.target);
const things = [
  ['box', [4, 4, -0.15], [8, 8, 0.3], 0xa49aa0],
  ['box', [1.5, 1.5, 0.5], [1, 1, 1], 0xe0533a],
  ['box', [3.5, 2.5, 0.5], [1, 1, 1], 0x3a7be0],
  ['box', [3.5, 2.5, 1.5], [1, 1, 1], 0x58c06a],
  ['sphere', [2.5, 5, 0.7], [0.7], 0xf2c53d],
  ['cyl', [5.5, 4.5, 1], [0.5, 2], 0xb06ad8],
  ['box', [14, 22, 2], [3, 3, 4], 0x8a8f9a],
  ['box', [-6, 40, 4], [5, 5, 8], 0x8a8f9a],
  ['box', [30, 60, 6], [8, 8, 12], 0x8a8f9a],
];
if (TERR) {
  const j = await (await fetch('/terrain_grids.json')).json();
  const grid = j.grids[Q.get('theme')];
  const st = blockStyle(L.terrain);
  const cells = [];
  for (let z = 0; z < j.H; z++) for (let y = 0; y < j.D; y++) for (let x = 0; x < j.W; x++) if (grid[(z * j.D + y) * j.W + x] === 1) cells.push([x, y, z]);
  const geo = terrainGeometry(cells.length, st.segs);
  const im = new THREE.InstancedMesh(geo, terrainMaterial(st, false), cells.length);
  cells.forEach(([x, y, z], i) => im.setMatrixAt(i, new THREE.Matrix4().makeTranslation(x + 0.5, y + 0.5, z + 0.5)));
  terrainCells(geo.attributes.aCell, grid, j.W, j.D, j.H, null);
  im.castShadow = im.receiveShadow = true;
  scene.add(im);
  if (Q.has('hazard')) { // ?hazard=z: 위험 표면 (hazard.js 그대로, 시각 3초 고정) + 잠긴 블록 물들임
    const HZ = await import('/hazard_demo.js');
    const { hazardField, HAZARD_MARGIN } = await import('/hazard-field.js');
    const zs = Number(Q.get('hazard'));
    const HL = L.hazard;
    const near = new THREE.Mesh(new THREE.PlaneGeometry(1, 1, C.HAZARD_SEG[0], C.HAZARD_SEG[0]), HZ.surfaceMaterial(HL.style, false, true));
    const far = new THREE.Mesh(new THREE.PlaneGeometry(2 * C.HAZARD_FAR_SIZE, 2 * C.HAZARD_FAR_SIZE, C.HAZARD_FAR_SEG, C.HAZARD_FAR_SEG), HZ.surfaceMaterial(HL.style, true, true));
    far.material.uniforms = near.material.uniforms;
    near.scale.set(j.W + 2 * HAZARD_MARGIN, j.D + 2 * HAZARD_MARGIN, 1);
    near.position.set(j.W / 2, j.D / 2, zs); far.position.set(j.W / 2, j.D / 2, zs);
    near.renderOrder = far.renderOrder = 1; far.frustumCulled = false;
    const f = hazardField(grid, j.W, j.D, j.H, zs);
    const data = new Uint8Array(f.nx * f.ny * 4);
    for (let i = 0; i < f.nx * f.ny; i++) { data[i * 4] = Math.round((f.dist[i] / 3) * 255); data[i * 4 + 1] = Math.round(Math.max(0, Math.min(1, (f.ground[i] + 10) / 40)) * 255); data[i * 4 + 3] = 255; }
    const tex = new THREE.DataTexture(data, f.nx, f.ny, THREE.RGBAFormat); tex.magFilter = tex.minFilter = THREE.LinearFilter; tex.needsUpdate = true;
    const u = near.material.uniforms;
    for (const k of ['Deep', 'Mid', 'Shallow', 'Foam']) u[`u${k}`].value.set(HL[k.toLowerCase()]);
    u.uAlpha.value.set(...HL.alpha); u.uReflect.value = HL.reflect; u.uDepthFade.value = HL.depthFade;
    u.uField.value = tex; u.uFieldRect.value.set(f.x0, f.y0, f.w, f.d); u.uMargin.value = HAZARD_MARGIN;
    u.uFog.value.copy(scene.fog.color); u.uFogRange.value.set(scene.fog.near, scene.fog.far, C.HAZARD_FAR_SIZE);
    const du = domeMat.uniforms;
    u.uHorizon.value.copy(du.horizon.value); u.uSky.value.copy(du.mid.value).lerp(du.horizon.value, 0.5); u.uSunDir.value.copy(du.sunDir.value);
    u.uTime.value = 3; u.uZ.value = zs; u.uWave.value.set(HL.wave[0], HL.wave[1]);
    du.below.value.lerp(new THREE.Color(HL.deep).lerp(scene.fog.color, C.HAZARD_FOG_MIX), 0.9);
    scene.add(near, far);
    const tintU = { uHz: { value: new THREE.Vector4(zs, HL.tintDepth, HL.band[1] * (0.85 + 0.15 * Math.sin(3 * 5)), 1) }, uHzTint: { value: new THREE.Color(HL.tint) }, uHzBand: { value: new THREE.Color(HL.band[0]) }, uHzMode: { value: HL.band[2] ? 1 : 0 } };
    HZ.Hazard.prototype.tint.call({ tintU }, im.material);
    window.hzTint = (m) => HZ.Hazard.prototype.tint.call({ tintU }, m);
  }
  if (st.sprout) new BlockDecor(scene, st, L.glow || (L.terrain.glow != null ? [L.terrain.glow] : null)).update(grid, j.W, j.D, j.H, null, false);
  things.length = 0;
  things.push(['box', [6, 6, -0.15], [12, 12, 0.3], 0xa49aa0]);
}
if (PIECES) things.length = 1;
for (const [kind, p, s, c] of things) {
  let g;
  if (kind === 'box') g = new THREE.BoxGeometry(...s);
  else if (kind === 'sphere') g = new THREE.SphereGeometry(s[0], 32, 16);
  else g = new THREE.CylinderGeometry(s[0], s[0], s[1], 24).rotateX(Math.PI / 2);
  let mat = toon({ color: c });
  if (L && p === things[0][1]) { // 바닥 판 = world.js apply 그대로 (floorTexture 는 js_shot 이 world_demo.js 로 내보냄)
    const { floorTexture } = await import('/world_demo.js');
    const ft = floorTexture(L.floor);
    ft.repeat.set(s[0] / 2, s[1] / 2);
    if (ft.userData.glow) ft.userData.glow.repeat.set(s[0] / 2, s[1] / 2);
    const top = toon(ft.userData.glow ? { map: ft, emissive: 0xffffff, emissiveMap: ft.userData.glow } : { map: ft });
    const rim = toon({ color: L.floor.rim });
    mat = [rim, rim, rim, rim, top, rim];
    if (window.hzTint) for (const m of [rim, top]) window.hzTint(m);
  }
  const m = new THREE.Mesh(g, mat);
  m.position.set(...p); m.castShadow = m.receiveShadow = true;
  scene.add(m);
}
if (PIECES) {
  things.length = 1;
  const look = new PieceLook(pieceSpec(Q.get('theme')), null, false);
  if (Q.has('light')) look.rim = C.GAME_LIGHT_PRESETS.vivid.rim;
  const shapes = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
  const im = new THREE.InstancedMesh(look.geo, look.material(Q.has('alpha') ? { color: 0xffffff, transparent: true, opacity: 0.55 } : { color: 0xffffff }), 10);
  const cells = shapes.map((sh, i) => [1 + i, 2, 0, sh]).concat([[2, 3, 0, 'T'], [2, 3, 1, 'T'], [5, 3, 0, 'L']]);
  cells.forEach(([x, y, z, sh], i) => { im.setMatrixAt(i, new THREE.Matrix4().makeTranslation(x + 0.5, y + 0.5, z + 0.5)); im.setColorAt(i, new THREE.Color(look.color(sh))); });
  im.castShadow = im.receiveShadow = true;
  scene.add(im);
  if (Q.has('light')) { // ?light: 판 빛 vivid — game-light.js GameLight 그대로 (하늘이 다 어두워질 때까지 frame 여러 번)
    const { GameLight } = await import('/game-light.js');
    const gl = new GameLight({ scene, renderer: R, dome });
    gl.setPreset('vivid');
    gl.themeApplied();
    const halos = cells.map(([x, y, z, sh]) => [x + 0.5, y + 0.5, z + 0.5, look.color(sh), 1]);
    for (let k = 0; k < 20; k++) gl.frame(true, halos, 0.1);
  }

const cam = new THREE.PerspectiveCamera(60, 1280 / 720, 0.05, 200);
cam.up.set(0, 0, 1); if (TERR) { cam.position.set(16, -5, 11); cam.lookAt(6, 6, 1); } else { cam.position.set(9, -5, 4); cam.lookAt(4, 8, 2.5); }

window.done = true;
